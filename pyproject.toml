[project]
name = "evap"
description = "EvaP"
version = "2026.5.0"
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = [
    "django-extensions~=4.1.0",
    "django-fsm-2~=4.2.4",
    "Django~=6.0.2",
    "mozilla-django-oidc~=5.0.2",
    "openpyxl~=3.1.5",
    "psycopg~=3.3.2",
    "pydantic~=2.13.3",
    "redis~=8.1.0",
    "requests~=2.34.2",
    "typing-extensions~=4.16.0",
    "xlwt~=1.3.0",
]

[project.optional-dependencies]
psycopg-binary = ["psycopg[binary]"]
psycopg-c = ["psycopg[c]"]

[dependency-groups]
dev = [
    "coverage~=7.15.0",
    "django-debug-toolbar~=7.0",
    "django-stubs~=6.0.2",
    "django-webtest~=1.9.13",
    "djangofmt~=0.2.11",
    "model-bakery~=1.24.0",
    "mypy~=2.3.0",
    "openpyxl-stubs~=0.1.25",
    "pylint-django~=2.8.0",
    "pylint~=4.0.4",
    "ruff~=0.16.1",
    "tblib~=3.2.2",
    "types-requests~=2.33.0",
    "xlrd~=2.0.1",
    "typeguard~=4.6.0",
    "selenium~=4.46.0",
]
lsp = [
    "python-lsp-server",
    "pylsp-rope",
    "python-lsp-ruff",
    "pylsp-mypy",
]

[tool.uv]
no-binary-package = [
    "psycopg-c",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = false  # otherwise, the artifacts below will be skipped
exclude = [
    "evap/static/bootstrap",
    "evap/static/font-awesome",
]
artifacts = [
    "evap/static/css/evap.css",
    "evap/static/css/evap.css.map",
    "evap/static/js/*.js",
    "evap/static/js/*.map",
    "evap/static/bootstrap/dist/js/bootstrap.bundle.min.js",
    "evap/static/bootstrap/dist/js/bootstrap.bundle.min.js.map",
    "evap/static/font-awesome/webfonts/",

    "evap/locale/**/*.mo",
]

##############################################

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Those are interesting, but not yet addressed: PYI,Q,SIM,PTH,TRY,RUF
select = ["F", "E", "B", "W", "N", "UP", "YTT", "FIX", "ASYNC", "A", "DJ", "EXE", "ICN", "G", "SLOT", "TID", "TCH", "INT", "C4", "ISC", "INP", "PIE", "RSE", "RET", "COM","PGH","FLY", "PERF", "PL", "BLE", "I", "INP", "TID252"]
ignore = [
    "E501",                  # line-too-long: black does code formatting for us
    "FIX004",                # hacks should be possible
    "A003",                  # we shadow some builtins sometime
    "DJ008",                 # do not use __str__ where it is not required
    "COM812",                # incompatible with formatter
    "N802",                  # not as mighty as pylint's invalid-name https://github.com/astral-sh/ruff/issues/7660
    "PLR0913",               # we can't determine a good limit for arguments. reviews should spot bad cases of this.
    "PLR2004", "PLW2901"
]

pep8-naming.extend-ignore-names = ["assert*", "*Formset"]  # custom assert methods use camelCase; Formsets use PascalCase

[tool.ruff.lint.pylint]
max-positional-args = 7      # Should match tool.pylint.design.max-positional-args  

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["N806"]  # migrations have model classes as local variables, we use PascalCase for these

[tool.ruff.format]
exclude = ["**/urls.py"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"evap.settings".msg = "Use django.conf.settings instead."

##############################################

[tool.djangofmt]
extend-exclude = ["evap/static/bootstrap"]
html-void-self-closing = "unchanged"
custom-blocks = ["breadcrumb_item", "breadcrumb_item_url"]

##############################################

[tool.pylint.master]
jobs = 0

load-plugins = ["pylint_django"]
django-settings-module = "evap.settings"

[tool.pylint.basic]
# For most code: snake_case, or PascalCaseFormset, because django does it that way.
# see https://docs.djangoproject.com/en/4.0/topics/forms/formsets/
# For migrations, models are assigned as local variables. Until pylint supports configuration-per-directory, we also
# need to allow that here (their issue 618)
variable-rgx = "(^[a-z0-9_]+$)|(^[A-Za-z]+$)|(^[A-Z_]+$)"
argument-rgx = "(^[a-z0-9_]+$)|(^[A-Za-z]+$)"
method-rgx = "(^[a-z0-9_]+$)|(^assert[A-Za-z]+$)"

# Allow 4 leading digits for migrations
module-rgx = "^([0-9]{4})?([a-z_][a-z0-9_]+)$"

good-names = [ "i", "j", "k", "ex", "Run", "_", "__", "e", "logger", "setUpClass", "setUpTestData", "setUp", "tearDown", "do_not_call_in_templates" ]

[tool.pylint.format]
expected-line-ending-format = "LF"

[tool.pylint.messages_control]
enable = ["all"]
disable = [
    "locally-disabled",               # we allow locally disabling some checks if we think it makes sense to do that.
    "suppressed-message",
    "ungrouped-imports",              # isort
    "wrong-import-order",             # isort
    "too-many-public-methods",        # reported for some models, that won't change
    "too-few-public-methods",         # noisy, e.g. exception classes, mixins etc
    "no-member",                      # false positives, deals badly with django classes
    "logging-format-interpolation",   # decided against the proposed change in favor of .format()
    "too-many-ancestors",             # noisy, reported for all test classes
    "missing-docstring",              # yeah... we don't have those
    "protected-access",               # for us that means "be careful", not "don't do it"
    "too-many-lines",                 # we don't currently think that splitting up views.py or test_views.py creates any value
    "duplicate-code",                 # Mostly imports and test setup.
    "cyclic-import",                  # We use these inside methods that require models from multiple apps. Tests will catch actual errors.
    "unsupported-binary-operation",   # broken in pylint: https://github.com/PyCQA/pylint/issues/7381
    "use-implicit-booleaness-not-comparison-to-string",  # forces us to use less expressive code
    "use-implicit-booleaness-not-comparison-to-zero",    # forces us to use less expressive code
    # the following are covered by ruff
    "broad-exception-caught", "line-too-long", "unused-wildcard-import", "wildcard-import", "too-many-arguments",
    "unnecessary-lambda-assignment",
    "wrong-import-position",
    # Obtained using a script (See: https://github.com/e-valuation/EvaP/pull/2767)
    # Very similar to the list (https://docs.astral.sh/ruff/default-rules/#pylint-pl) mapped to pylint names for the codes.
    "typevar-name-incorrect-variance", #PLC0105
    "typevar-double-variance", #PLC0131
    "typevar-name-mismatch", #PLC0132
    "single-string-used-for-slots", #PLC0205
    "consider-using-dict-items", #PLC0206
    "use-maxsplit-arg", #PLC0207
    "use-sequence-for-iteration", #PLC0208
    "useless-import-alias", #PLC0414
    "import-outside-toplevel", #PLC0415
    "use-implicit-booleaness-not-len", #PLC1802
    "non-ascii-name", #PLC2401
    "non-ascii-module-import", #PLC2403
    "unnecessary-direct-lambda-call", #PLC3002
    "init-is-generator", #PLE0100
    "return-in-init", #PLE0101
    "nonlocal-and-global", #PLE0115
    "nonlocal-without-binding", #PLE0117
    "used-prior-global-declaration", #PLE0118
    "assigning-non-slot", #PLE0237
    "duplicate-bases", #PLE0241
    "unexpected-special-method-signature", #PLE0302
    "invalid-length-returned", #PLE0303
    "invalid-bool-returned", #PLE0304
    "invalid-index-returned", #PLE0305
    "invalid-str-returned", #PLE0307
    "invalid-bytes-returned", #PLE0308
    "invalid-hash-returned", #PLE0309
    "invalid-all-object", #PLE0604
    "invalid-all-format", #PLE0605
    "potential-index-error", #PLE0643
    "misplaced-bare-raise", #PLE0704
    "repeated-keyword", #PLE1132
    "await-outside-async", #PLE1142
    "logging-too-many-args", #PLE1205
    "logging-too-few-args", #PLE1206
    "bad-format-character", #PLE1300
    "bad-string-format-type", #PLE1307
    "bad-str-strip-call", #PLE1310
    "invalid-envvar-value", #PLE1507
    "singledispatch-method", #PLE1519
    "singledispatchmethod-function", #PLE1520
    "yield-inside-async-function", #PLE1700
    "bidirectional-unicode", #PLE2502
    "invalid-character-backspace", #PLE2510
    "invalid-character-sub", #PLE2512
    "invalid-character-esc", #PLE2513
    "invalid-character-nul", #PLE2514
    "invalid-character-zero-width-space", #PLE2515
    "comparison-with-itself", #PLR0124
    "comparison-of-constants", #PLR0133
    "property-with-parameters", #PLR0206
    "consider-using-from-import", #PLR0402
    "too-many-return-statements", #PLR0911
    "too-many-branches", #PLR0912
    "too-many-statements", #PLR0915
    "too-many-positional-arguments", #PLR0917
    "redefined-argument-from-local", #PLR1704
    "stop-iteration-return", #PLR1708
    "useless-return", #PLR1711
    "consider-using-in", #PLR1714
    "chained-comparison", #PLR1716
    "consider-using-sys-exit", #PLR1722
    "consider-using-min-builtin", #PLR1730
    "unnecessary-dict-index-lookup", #PLR1733
    "unnecessary-list-index-lookup", #PLR1736
    "unnecessary-lambda", #PLW0108
    "useless-else-on-loop", #PLW0120
    "self-assigning-variable", #PLW0127
    "redeclared-assigned-name", #PLW0128
    "assert-on-string-literal", #PLW0129
    "named-expr-without-context", #PLW0131
    "pointless-exception-statement", #PLW0133
    "nan-comparison", #PLW0177
    "bad-staticmethod-argument", #PLW0211
    "super-without-brackets", #PLW0245
    "import-self", #PLW0406
    "global-variable-not-assigned", #PLW0602
    "global-statement", #PLW0603
    "global-at-module-level", #PLW0604
    "self-cls-assignment", #PLW0642
    "binary-op-exception", #PLW0711
    "bad-open-mode", #PLW1501
    "shallow-copy-environ", #PLW1507
    "invalid-envvar-default", #PLW1508
    "subprocess-popen-preexec-fn", #PLW1509
    "subprocess-run-check", #PLW1510
    "useless-with-lock", #PLW2101
    "nested-min-max", #PLW3301
]

[tool.pylint.design]
max-positional-arguments = 7

##############################################

[tool.coverage.run]
branch = true
omit = ["*migrations*", "*__init__.py"]
source = ["evap", "tools"]

[tool.coverage.report]
omit = ["*/migrations/*", "*__init__.py"]
exclude_also = [
    # mypy asserts these cases are not possible
    '\n.*assert_never\(.*\)', # \n excludes previous line, see https://coverage.readthedocs.io/en/latest/excluding.html#multi-line-exclusion-regexes
]

##############################################

[tool.mypy]
packages = ["evap", "tools"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "evap.settings"

[[tool.mypy.overrides]]
module = [
    "django_fsm.*",
    "django_sendfile.*",
    "django_webtest.*",
    "debug_toolbar.*",
    "mozilla_django_oidc.*",
    "model_bakery.*",
    "webtest.*",
    "xlrd.*",
    "xlwt.*",

    "evap.staff.fixtures.*",
]
ignore_missing_imports = true

##############################################

[tool.pytest.ini_options]
# We don't officially use pytest, but last time we wanted to, this worked for us with pytest-django
# pytest-xdist worked for parallelizing tests.
DJANGO_SETTINGS_MODULE = "evap.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["evap", "tools"]
norecursedirs=["locale", "logs", "static", "static_collected", "upload"]
addopts = "--reuse-db"
